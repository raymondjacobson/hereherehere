<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add a friend · hereherehere</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="wrap center">
      <div id="blob" class="blob pink">🤝</div>
      <h1 id="title">A friend wants to connect</h1>
      <p class="fp" id="fingerprint"></p>
      <p class="lede" id="lede">Open hereherehere to add them.</p>

      <div style="width: 100%; display: grid; gap: 10px; margin-top: 24px">
        <a class="btn" id="open">Open in hereherehere</a>
        <a class="btn secondary" id="store" href="#">Get the app</a>
      </div>

      <div class="spacer"></div>
      <footer>
        Friend codes are one-way. To see each other's heres, both people need to add each other.
      </footer>
    </main>
    <script type="module" src="/src/friend.ts"></script>
  </body>
</html>
